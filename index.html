<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152845">
  <meta name="description" content="复古卡通 3D 卡丁车计时赛。漂移攒氮气，挑战自己的最佳圈。">
  <title>晴空卡丁车 · Sunshine Kart</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body data-mode="menu">
  <main id="game" aria-label="晴空卡丁车">
    <div id="stage" aria-hidden="true"></div>
    <audio id="race-music" src="https://kartrider.wiki.gg/zh/images/transcoded/Title.ogg/Title.ogg.mp3" preload="metadata" loop hidden></audio>
    <div class="shade" aria-hidden="true"></div>
    <header class="topbar">
      <div class="brand"><span class="flag" aria-hidden="true"></span><span>SUNSHINE<i>KART</i></span></div>
      <div class="actions">
        <button class="icon-button" id="sound" type="button" aria-label="关闭声音" aria-pressed="false" title="声音 (M)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3Z"/><path class="sound-on" d="M16 9c1.4 1.6 1.4 4.4 0 6m3-9c3.1 3.3 3.1 8.7 0 12"/><path class="sound-off" d="m16 10 5 5m0-5-5 5"/></svg>
        </button>
        <button class="icon-button" id="pause" type="button" aria-label="暂停" title="暂停 (Esc)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14m6-14v14"/></svg>
        </button>
      </div>
    </header>
    <section class="intro" aria-labelledby="title">
      <div class="mode"><span class="mode-dot"></span>单人计时赛</div>
      <h1 id="title"><span>晴空</span><span>卡丁车</span></h1>
      <p class="intro-copy">海风、发卡弯，还有一罐满满的氮气。</p>
      <button type="button" class="primary" id="start">开始比赛 <span aria-hidden="true">→</span></button>
      <p class="key-start">按 <kbd>Enter</kbd> 也可发车</p>
    </section>
    <footer class="intro-footer">
      <div class="track-card">
        <canvas id="menu-map" width="150" height="120" aria-label="海湾环道路线图"></canvas>
        <div><span class="minor">赛道</span><strong>海湾环道</strong><span class="track-distance" id="distance"></span></div>
      </div>
      <div class="control-guide" aria-label="键盘操作">
        <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd><small>驾驶</small></span>
        <span><kbd>Shift</kbd><small>漂移</small></span>
        <span><kbd>Space</kbd><small>氮气</small></span>
      </div>
    </footer>
    <section class="race-hud" aria-label="比赛仪表">
      <div class="timing">
        <div><span class="minor" id="lap">第 1 圈</span><strong id="time">00:00.000</strong></div>
        <div class="best-timing"><span class="minor">最佳单圈</span><strong id="best">--:--.---</strong></div>
      </div>
      <div class="race-map"><canvas id="map" width="280" height="230" aria-label="赛道位置图"></canvas></div>
      <div id="count" class="count" hidden></div>
      <div id="message" class="message" role="status" hidden></div>
      <div class="telemetry">
        <div class="speed"><strong id="speed">000</strong><span>KM/H</span></div>
        <div class="boost-label"><b>N₂O</b><span id="boost-label">漂移蓄力</span></div>
        <div class="boost-track" id="boost-track" role="meter" aria-label="氮气储量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="boost-fill"></i></div>
      </div>
    </section>
    <div class="touch-controls" aria-label="触屏操作">
      <div><button data-key="ArrowLeft" aria-label="左转">◀</button><button data-key="ArrowRight" aria-label="右转">▶</button></div>
      <div><button data-key="ShiftLeft">漂移</button><button data-key="Space">氮气</button><button data-key="ArrowUp">油门</button><button data-key="ArrowDown" aria-label="刹车">刹车</button></div>
    </div>
    <section id="pause-menu" class="modal" aria-labelledby="pause-title" hidden>
      <div class="pause-card">
        <h2 id="pause-title">比赛暂停</h2>
        <button class="primary" id="resume" type="button">继续比赛 <span aria-hidden="true">→</span></button>
        <button class="secondary" id="restart" type="button">重新发车</button>
        <button class="secondary" id="back" type="button">返回标题</button>
      </div>
    </section>
    <div class="modal" id="error" role="alert" hidden><div class="pause-card"><h2>赛道加载失败</h2><p>请使用支持 WebGL 2 的浏览器打开游戏。</p></div></div>
  </main>
  <script type="module" src="./game.js?v=2"></script>
</body>
</html>
